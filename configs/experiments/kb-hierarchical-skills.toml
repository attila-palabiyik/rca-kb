# hierarchical-skills: built on A, frozen, run on B, with its empty-KB control.
# Generated by scripts/make_approaches.py.

dataset = "chipbench"
split   = "main"
repeats = 3
seed    = 1
max_parallel = 10
retries = 2

[monitor]
judge_model = "gpt-6.2-sol"
rubric      = "v1"
assessment  = "v1"

[[conditions]]
name = "build"
mode = "build"
kb   = "hierarchical-skills"
side = ["A"]

[[conditions]]
name     = "eval"
mode     = "eval"
kb       = "hierarchical-skills"
side     = ["B"]
snapshot = "build"

[[conditions]]
name     = "empty"
mode     = "eval"
kb       = "hierarchical-skills"
side     = ["B"]
snapshot = "seed"
