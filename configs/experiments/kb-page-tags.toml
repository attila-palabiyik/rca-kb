# page-tags: built on A, frozen, run on B, with its empty-KB control.
# Generated by scripts/make_approaches.py.

dataset = "chipbench"
split   = "main"
repeats = 1
seed    = 1
max_parallel = 10
retries = 2

[monitor]
judge_model = "gpt-6.2-sol"
rubric      = "v2"
assessment  = "v1"

[[conditions]]
name   = "build"
mode   = "build"
kb     = "page-tags"
side   = ["A"]
reveal = "fix"              # the agent sees the verdict and the correct fix before it updates

[[conditions]]
name     = "eval"
mode     = "eval"
kb       = "page-tags"
side     = ["B"]
snapshot = "build"
reveal   = "fix"

[[conditions]]
name     = "empty"
mode     = "eval"
kb       = "page-tags"
side     = ["B"]
snapshot = "seed"
reveal   = "fix"
