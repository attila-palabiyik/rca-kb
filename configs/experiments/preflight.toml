# Three timed runs, one per bug category, to confirm the run path and to
# measure how long a run takes before anything larger starts.

dataset = "chipbench"
split   = "main"
repeats = 1
seed    = 1
max_parallel = 3
retries = 0
tasks = [
    "arithmetic__Prob001_continuous_input_sequence_detect",
    "timing__Prob022_synchronous_FIFO",
    "state_machine__Prob033_traffic_lights",
]

[monitor]
judge_model = "gpt-6.2-sol"
rubric      = "v2"
assessment  = "v1"

[[conditions]]
name = "baseline"
mode = "baseline"
side = ["A", "B"]
