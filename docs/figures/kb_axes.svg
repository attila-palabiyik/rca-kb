<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 356" font-family="'Figtree', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#0d1117">
  <defs><marker id="head-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#5b6068" stroke-width="1.3"/></marker><marker id="head-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#0d1117" stroke-width="1.3"/></marker><marker id="head-kb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#fd6420" stroke-width="1.3"/></marker></defs>
  <rect x="0" y="0" width="540" height="356" rx="8" fill="#f4f4f4"/>
  <rect x="580" y="0" width="540" height="356" rx="8" fill="#f4f4f4"/>
  <text x="32" y="52" font-size="28" font-weight="600" fill="#0d1117" text-anchor="start">Curation</text>
  <text x="32" y="80" font-size="16" font-weight="400" fill="#5b6068" text-anchor="start">what the agent keeps from a finished task</text>
  <text x="612" y="52" font-size="28" font-weight="600" fill="#0d1117" text-anchor="start">Retrieval</text>
  <text x="612" y="80" font-size="16" font-weight="400" fill="#5b6068" text-anchor="start">how the next task finds it</text>
  <rect x="32" y="116" width="190" height="88" rx="6" fill="#fff" stroke="#0d1117" stroke-width="1.25"/>
  <text x="45" y="141" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Finished task</text>
  <text x="45" y="161" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">the answer, the verdict</text>
  <text x="45" y="178" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">and the correct fix</text>
  <rect x="898" y="116" width="190" height="88" rx="6" fill="#fff" stroke="#0d1117" stroke-width="1.25"/>
  <text x="911" y="141" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Next task</text>
  <text x="911" y="161" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">opens the entries</text>
  <text x="911" y="178" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">that bear on it</text>
  <path d="M222 160 L463 160" fill="none" stroke="#fd6420" stroke-width="1.25" marker-end="url(#head-kb)"/>
  <path d="M655 160 L896 160" fill="none" stroke="#fd6420" stroke-width="1.25" marker-end="url(#head-kb)"/>
  <text x="342" y="151" font-size="11.5" font-weight="500" fill="#c4490f" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">writes</text>
  <text x="776" y="151" font-size="11.5" font-weight="500" fill="#c4490f" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">reads</text>
  <rect x="465" y="116" width="190" height="88" rx="6" fill="#fff4ec" stroke="#fd6420" stroke-width="1.25"/>
  <text x="478" y="141" font-size="16" font-weight="600" fill="#c4490f" text-anchor="start">Knowledge base</text>
  <text x="478" y="161" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">entries, arranged</text>
  <text x="478" y="178" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">by an index</text>
  <path d="M32 238 L508 238" fill="none" stroke="#5b6068" stroke-width="1"/>
  <path d="M612 238 L1088 238" fill="none" stroke="#5b6068" stroke-width="1"/>
  <text x="32" y="270" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Entry type</text>
  <text x="120" y="270" font-size="14.5" font-weight="400" fill="#5b6068" text-anchor="start">what one entry holds</text>
  <text x="32" y="300" font-size="15.5" font-weight="500" fill="#0d1117" text-anchor="start">Transcript  ·  Summary  ·  Note  ·  Rule</text>
  <text x="32" y="324" font-size="15.5" font-weight="500" fill="#0d1117" text-anchor="start">Page  ·  Skill  ·  Guide  ·  Step</text>
  <text x="612" y="270" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Index</text>
  <text x="662" y="270" font-size="14.5" font-weight="400" fill="#5b6068" text-anchor="start">how entries are arranged and found</text>
  <text x="612" y="300" font-size="15.5" font-weight="500" fill="#0d1117" text-anchor="start">Single file  ·  Flat files  ·  Catalogue  ·  Signature key</text>
  <text x="612" y="324" font-size="15.5" font-weight="500" fill="#0d1117" text-anchor="start">Tags  ·  Hierarchy  ·  Graph  ·  Similarity search</text>
</svg>
