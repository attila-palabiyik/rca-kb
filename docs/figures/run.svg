<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" font-family="'Figtree', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#0d1117">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6068" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- column heads -->
  <text x="0" y="12" font-weight="700">Prepare</text>
  <text x="156" y="12" font-weight="700">Agent container</text>
  <text x="380" y="12" font-weight="700">Grader container</text>
  <text x="520" y="12" font-weight="700">Records</text>

  <!-- prepare -->
  <text x="0" y="40">Task</text>
  <text x="0" y="52" fill="#5b6068">specification and the</text>
  <text x="0" y="63" fill="#5b6068">module with one bug</text>
  <text x="0" y="88">Setup</text>
  <text x="0" y="100" fill="#5b6068">base, plus the approach's</text>
  <text x="0" y="111" fill="#5b6068">overlay of instructions</text>
  <text x="0" y="136" fill="#c4490f">KB</text>
  <text x="0" y="148" fill="#5b6068">a private copy of the</text>
  <text x="0" y="159" fill="#5b6068">current snapshot</text>

  <!-- agent container -->
  <rect x="156.5" y="24.5" width="196" height="148" fill="none" stroke="#0d1117"/>
  <text x="168" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">/app</text>
  <text x="200" y="44" fill="#5b6068">workspace, the module to edit</text>
  <text x="168" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#c4490f">/kb</text>
  <text x="200" y="60" fill="#5b6068">the KB copy; some files linked</text>
  <text x="200" y="71" fill="#5b6068">to where the CLI looks itself</text>
  <text x="168" y="92">Codex CLI, Icarus Verilog,</text>
  <text x="168" y="104">a local similarity search</text>
  <line x1="168" y1="118.5" x2="341" y2="118.5" stroke="#d9d9d9"/>
  <text x="168" y="135" font-weight="700">Solve</text>
  <text x="200" y="135" fill="#5b6068">turn one</text>
  <text x="168" y="155" font-weight="700" fill="#c4490f">Update</text>
  <text x="208" y="155" fill="#5b6068">same session, after the result</text>
  <text x="208" y="166" fill="#5b6068">and the fix; build runs only</text>

  <!-- arrows prepare -> agent -->
  <line x1="122" y1="58" x2="152" y2="58" stroke="#5b6068" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="122" y1="106" x2="152" y2="106" stroke="#5b6068" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="122" y1="154" x2="152" y2="154" stroke="#fd6420" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- answer to grader -->
  <line x1="353" y1="58" x2="376" y2="58" stroke="#5b6068" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="366.5" y="53" font-size="7.5" fill="#5b6068" text-anchor="middle">answer</text>

  <!-- grader container -->
  <rect x="380.5" y="24.5" width="116" height="96" fill="none" stroke="#0d1117"/>
  <text x="392" y="44">Testbench and</text>
  <text x="392" y="56">reference module</text>
  <text x="392" y="74" fill="#5b6068">never in the agent's</text>
  <text x="392" y="85" fill="#5b6068">container</text>
  <text x="392" y="100" font-weight="700">Verdict</text>
  <text x="392" y="112" fill="#5b6068">pass on no mismatch</text>

  <!-- verdict back to update -->
  <path d="M438.5 119 V150 H357" fill="none" stroke="#fd6420" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="372" y="143" font-size="8.5" fill="#c4490f">shown on A</text>

  <!-- records -->
  <line x1="497" y1="70" x2="516" y2="70" stroke="#5b6068" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="520" y="40">One record per run</text>
  <text x="520" y="52" fill="#5b6068">answer, verdict, tokens,</text>
  <text x="520" y="63" fill="#5b6068">time, trajectory</text>
  <text x="520" y="88">Monitor</text>
  <text x="520" y="100" fill="#5b6068">a judge and a pattern</text>
  <text x="520" y="111" fill="#5b6068">match read every run</text>
  <text x="520" y="136">Review, then report</text>
  <text x="520" y="148" fill="#5b6068">a person clears or</text>
  <text x="520" y="159" fill="#5b6068">voids each flagged run</text>

</svg>
