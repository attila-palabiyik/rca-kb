<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 372" font-family="'Figtree', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#0d1117">
  <defs><marker id="head-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#5b6068" stroke-width="1.3"/></marker><marker id="head-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#0d1117" stroke-width="1.3"/></marker><marker id="head-kb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#fd6420" stroke-width="1.3"/></marker></defs>
  <text x="160" y="14" font-size="14" font-weight="600" fill="#5b6068" text-anchor="start">Prepare</text>
  <text x="270" y="14" font-size="14" font-weight="600" fill="#5b6068" text-anchor="start">Solve</text>
  <text x="600" y="14" font-size="14" font-weight="600" fill="#5b6068" text-anchor="start">Grade</text>
  <text x="790" y="14" font-size="14" font-weight="600" fill="#c4490f" text-anchor="start">Update</text>
  <text x="1000" y="14" font-size="14" font-weight="600" fill="#5b6068" text-anchor="start">Record</text>
  <path d="M160 26 L1120 26" fill="none" stroke="#5b6068" stroke-width="1"/>
  <text x="0" y="86" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Agent container</text>
  <text x="0" y="106" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">fresh for every run</text>
  <text x="0" y="198" font-size="16" font-weight="600" fill="#c4490f" text-anchor="start">KB</text>
  <text x="0" y="218" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">snapshots, by hash</text>
  <text x="0" y="306" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Grader container</text>
  <text x="0" y="326" font-size="13.5" font-weight="400" fill="#5b6068" text-anchor="start">never seen by the agent</text>
  <rect x="160" y="52" width="92" height="36" rx="6" fill="#fff" stroke="#8f949b" stroke-width="1"/>
  <text x="206" y="75" font-size="13.5" font-weight="500" fill="#5b6068" text-anchor="middle">task</text>
  <rect x="160" y="100" width="92" height="36" rx="6" fill="#fff" stroke="#8f949b" stroke-width="1"/>
  <text x="206" y="123" font-size="13.5" font-weight="500" fill="#5b6068" text-anchor="middle">setup</text>
  <path d="M252 70 L268 70" fill="none" stroke="#5b6068" stroke-width="1.25" marker-end="url(#head-soft)"/>
  <path d="M252 118 L268 118" fill="none" stroke="#5b6068" stroke-width="1.25" marker-end="url(#head-soft)"/>
  <rect x="270" y="52" width="290" height="84" rx="6" fill="#f4f4f4" stroke="#0d1117" stroke-width="1.25"/>
  <text x="286" y="84" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Codex solves the task</text>
  <text x="286" y="107" font-size="13" font-weight="400" fill="#5b6068" text-anchor="start">edits the module, may write its own tests</text>
  <rect x="790" y="52" width="180" height="84" rx="6" fill="#fff4ec" stroke="#fd6420" stroke-width="1.25"/>
  <text x="806" y="84" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">The session resumes</text>
  <text x="806" y="107" font-size="13" font-weight="400" fill="#5b6068" text-anchor="start">and updates the KB</text>
  <rect x="160" y="182" width="92" height="44" rx="6" fill="#ffd9bd" stroke="#fd6420" stroke-width="1.25"/>
  <text x="206" y="209" font-size="13" font-weight="500" fill="#0d1117" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">08f97f</text>
  <rect x="1000" y="182" width="92" height="44" rx="6" fill="#ffd9bd" stroke="#fd6420" stroke-width="1.25"/>
  <text x="1046" y="209" font-size="13" font-weight="500" fill="#0d1117" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">54e89f</text>
  <path d="M252 204 L310 204 L310 138" fill="none" stroke="#fd6420" stroke-width="1.25" marker-end="url(#head-kb)"/>
  <text x="318" y="176" font-size="12.5" font-weight="500" fill="#c4490f" text-anchor="start">a private copy</text>
  <path d="M880 136 L880 204 L998 204" fill="none" stroke="#fd6420" stroke-width="1.25" marker-end="url(#head-kb)"/>
  <text x="888" y="196" font-size="12.5" font-weight="500" fill="#c4490f" text-anchor="start">next snapshot</text>
  <rect x="600" y="272" width="164" height="84" rx="6" fill="#f4f4f4" stroke="#0d1117" stroke-width="1.25"/>
  <text x="616" y="304" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Testbench</text>
  <text x="616" y="327" font-size="13" font-weight="400" fill="#5b6068" text-anchor="start">against the reference</text>
  <rect x="1000" y="272" width="120" height="84" rx="6" fill="#fff" stroke="#0d1117" stroke-width="1.25"/>
  <text x="1014" y="304" font-size="16" font-weight="600" fill="#0d1117" text-anchor="start">Run record</text>
  <text x="1014" y="327" font-size="13" font-weight="400" fill="#5b6068" text-anchor="start">verdict, tokens,</text>
  <text x="1014" y="344" font-size="13" font-weight="400" fill="#5b6068" text-anchor="start">time, trajectory</text>
  <path d="M540 136 L540 314 L598 314" fill="none" stroke="#5b6068" stroke-width="1.25" marker-end="url(#head-soft)"/>
  <text x="548" y="258" font-size="12.5" font-weight="500" fill="#5b6068" text-anchor="start">answer</text>
  <path d="M764 296 L830 296 L830 138" fill="none" stroke="#fd6420" stroke-width="1.25" marker-end="url(#head-kb)"/>
  <text x="838" y="258" font-size="12.5" font-weight="500" fill="#c4490f" text-anchor="start">verdict and the fix</text>
  <path d="M764 336 L998 336" fill="none" stroke="#5b6068" stroke-width="1.25" marker-end="url(#head-soft)"/>
</svg>
